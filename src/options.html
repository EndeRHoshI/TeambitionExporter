<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Teambition 导出记录与诊断</title>
<style>body{font:15px/1.7 system-ui;max-width:760px;margin:28px auto;padding:0 20px;color:#172b4d}section{padding:18px;border:1px solid #dce2ea;border-radius:10px;margin:18px 0}button{padding:9px 15px;margin:6px 6px 6px 0;cursor:pointer}input,textarea{box-sizing:border-box;width:100%;padding:10px}textarea{height:220px}#last,#message{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<h1>Teambition 导出记录与诊断</h1><p>现在每次点击插件图标，都会打开保存小窗口。选择目录即可导出，无需在这里提前授权。</p>
<section><h2>最近一次导出</h2><p id="last">尚无导出记录</p><button id="copy-log">复制诊断信息</button><button id="refresh">刷新状态</button><p id="message" role="status"></p><textarea id="logs" readonly aria-label="诊断信息"></textarea></section>
<script type="module" src="options.js"></script></html>
